name: Build Android APK

on:
  push:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          mkdir -p "$HOME/.buildozer"
          docker run --rm \
            -v "$HOME/.buildozer:/home/user/.buildozer" \
            -v "${{ github.workspace }}:/home/user/hostcwd" \
            ghcr.io/kivy/buildozer:latest@sha256:27e67ef7983b5603f79cb956796d8227e24ddaf6d63c265664fad54bf58f5b7b \
            android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
